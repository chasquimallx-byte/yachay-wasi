name: Compilar APK Yachay Wasi

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Pruebas unitarias
        run: gradle --no-daemon testDebugUnitTest

      - name: Compilar APK (debug, instalable)
        run: gradle --no-daemon assembleDebug

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk YachayWasi-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: YachayWasi-APK
          path: YachayWasi-debug.apk

      - name: Publicar en Releases (solo con etiqueta vX.Y)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: YachayWasi-debug.apk
